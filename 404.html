<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ETAX — Redirecting…</title>
  <script>
    // SPA fallback for GitHub Pages: send unknown paths to the hash router.
    (function () {
      var base = location.pathname.replace(/\/[^\/]*$/, "/");
      if (!/\/$/.test(base)) base += "/";
      location.replace(base + "index.html#/" );
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="./index.html#/">ETAX home</a>…</p>
</body>
</html>
